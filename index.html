<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FAJNR LORE – 3</title>
<style>
body{background:#05060a;color:#fff;font-family:Arial;text-align:center;margin-top:10%}
button{padding:12px 20px;border:none;border-radius:6px;background:#4c6fff;color:#fff;cursor:pointer}
button:hover{background:#3a55d0}
.hint{margin-top:20px;color:#8ef5ff;font-family:monospace}
</style>
</head>
<body>

<h1>FAJNR LORE</h1>
<p>secretcode: KFSRNJB</p>

<button onclick="a()">Odomknúť vstup</button>
<div id="b"></div>

<script>
function a(){
    let d=document.getElementById("b");
    let i=document.createElement("input");
    i.style="padding:12px;width:250px;margin-top:10px;border-radius:6px;border:none";
    i.id="x";
    let c=document.createElement("button");
    c.innerHTML="Potvrdiť";
    c.onclick=f;
    d.appendChild(i);
    d.appendChild(c);
}

function f(){
    let v=document.getElementById("x").value.trim();

    let arrP=[156,144,168,160,169,158,165];
    let s=arrP.map((n,i)=>String.fromCharCode(n-[20,12,25,18,27,14,19][i])).join("");

    if(v===s){
        document.body.innerHTML="<h1 style='color:white;text-align:center;margin-top:20%'>GG</h1>";
    }
}
</script>

</body>
</html>
